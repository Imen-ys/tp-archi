<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add User</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>

    <nav class="navbar navbar-dark" style="background-color: green;">
        <span class="navbar-brand">User Management App</span>
    </nav>

    <div class="container mt-4" style="max-width: 800px;">
        <h2 class="text-center">Add New User</h2>
        <hr>

        <form th:action="@{/add}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" class="form-control" th:field="*{name}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" th:field="*{email}" required>
            </div>

            <button type="submit" class="btn btn-danger">Save</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

</body>
</html>
